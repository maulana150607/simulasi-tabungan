<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulasi Anggaran & Tabungan Fleksibel</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #f0f2f5;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      color: #1f2937;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 520px;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    /* Profil & Header */
    .profile-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }
    .profile-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar-wrap {
      position: relative;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid #003366;
      cursor: pointer;
      flex-shrink: 0;
      background: #e5e7eb;
    }
    .avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .avatar-hint {
      font-size: 0.72rem;
      color: #6b7280;
      margin-top: 2px;
    }
    h2 {
      margin: 0;
      font-size: 1.15rem;
      color: #003366;
      line-height: 1.25;
    }
    .btn-reset {
      background: #e5e7eb;
      color: #374151;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }
    .btn-reset:hover {
      background: #d1d5db;
    }

    /* Ringkasan Utama */
    .summary-box {
      background: #003366;
      color: #ffffff;
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      margin-bottom: 24px;
      transition: background 0.3s ease;
    }
    .summary-box.minus {
      background: #b91c1c;
    }
    .summary-box .label {
      font-size: 0.85rem;
      opacity: 0.85;
    }
    .summary-box .amount {
      font-size: 2.1rem;
      font-weight: 700;
      margin: 6px 0 14px 0;
    }
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      padding-top: 12px;
      font-size: 0.8rem;
    }
    .stats-row div span {
      display: block;
      opacity: 0.8;
      margin-bottom: 2px;
    }
    .stats-row div strong {
      font-size: 0.9rem;
    }

    /* Section Header */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 20px 0 12px 0;
      padding-bottom: 6px;
      border-bottom: 2px solid #f3f4f6;
    }
    .section-header h3 {
      margin: 0;
      font-size: 1rem;
      color: #003366;
    }
    .btn-add {
      background: #003366;
      color: #ffffff;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-add:hover {
      background: #002244;
    }

    /* Item Baris (Editable) */
    .item-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .item-row {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 10px 12px;
    }
    .item-top {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    .input-name {
      flex: 1;
      border: 1px solid transparent;
      background: transparent;
      font-weight: 600;
      font-size: 0.92rem;
      color: #1f2937;
      padding: 4px 6px;
      border-radius: 6px;
    }
    .input-name:focus {
      background: #ffffff;
      border-color: #003366;
      outline: none;
    }
    .input-nominal {
      width: 120px;
      border: 1px solid #d1d5db;
      background: #ffffff;
      font-weight: 700;
      font-size: 0.92rem;
      color: #003366;
      padding: 5px 8px;
      border-radius: 6px;
      text-align: right;
    }
    .input-nominal.expense-text {
      color: #dc2626;
    }
    .btn-del {
      background: #fee2e2;
      color: #dc2626;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-del:hover {
      background: #fecaca;
    }
    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    input[type="range"] {
      flex: 1;
      cursor: pointer;
      accent-color: #003366;
    }
    input[type="range"].expense-slider {
      accent-color: #dc2626;
    }

    /* Target Tabungan */
    .target-box {
      margin-top: 22px;
      background: #f0f7ff;
      border: 1px solid #bae6fd;
      border-radius: 12px;
      padding: 14px;
    }
    .target-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 600;
      color: #003366;
      margin-bottom: 8px;
    }
    .target-input {
      width: 130px;
      padding: 4px 8px;
      border: 1px solid #93c5fd;
      border-radius: 6px;
      font-weight: 700;
      color: #003366;
      text-align: right;
    }
    .progress-bar {
      width: 100%;
      height: 10px;
      background: #dbeafe;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 6px;
    }
    .progress-fill {
      height: 100%;
      background: #003366;
      width: 0%;
      transition: width 0.3s ease;
    }
    .target-status {
      font-size: 0.8rem;
      color: #374151;
    }
  </style>
</head>
<body>

<div class="card">
  <!-- Header dengan Foto Profil -->
  <div class="profile-header">
    <div class="profile-info">
      <div class="avatar-wrap" onclick="document.getElementById('fotoInput').click()" title="Ketuk untuk ganti foto">
        <img id="avatarImg" src="foto.jpg" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23003366%22/><text x=%2250%22 y=%2258%22 font-size=%2242%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22>👤</text></svg>'" alt="Foto Profil">
      </div>
      <div>
        <h2>Simulasi Anggaran</h2>
        <div class="avatar-hint">Ketuk foto untuk mengganti</div>
      </div>
      <input type="file" id="fotoInput" accept="image/*" style="display:none" onchange="gantiFoto(event)">
    </div>
    <button class="btn-reset" onclick="resetDefault()">Reset</button>
  </div>

  <!-- Ringkasan Sisa / Tabungan -->
  <div class="summary-box" id="summaryBox">
    <div class="label" id="statusLabel">Potensi Tabungan (Sisa Bersih)</div>
    <div class="amount" id="sisaUang">Rp0</div>
    <div class="stats-row">
      <div>
        <span>Pendapatan</span>
        <strong id="totalMasuk">Rp0</strong>
      </div>
      <div>
        <span>Pengeluaran</span>
        <strong id="totalKeluar">Rp0</strong>
      </div>
      <div>
        <span>Rasio Tabungan</span>
        <strong id="rasioTabungan">0%</strong>
      </div>
    </div>
  </div>

  <!-- Bagian Pendapatan -->
  <div class="section-header">
    <h3>1. Sumber Pendapatan</h3>
    <button class="btn-add" onclick="tambahItem('income')">+ Tambah</button>
  </div>
  <div class="item-list" id="incomeList"></div>

  <!-- Bagian Pengeluaran -->
  <div class="section-header">
    <h3>2. Daftar Pengeluaran</h3>
    <button class="btn-add" onclick="tambahItem('expense')">+ Tambah</button>
  </div>
  <div class="item-list" id="expenseList"></div>

  <!-- Target Tabungan -->
  <div class="target-box">
    <div class="target-header">
      <span>Target Tabungan (Rp)</span>
      <input type="number" class="target-input" id="targetInput" value="500000" step="10000" oninput="hitungSemua()">
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="target-status" id="targetStatus">Menghitung target...</div>
  </div>
</div>

<script>
  const defaultData = {
    incomes: [
      { id: 1, name: "Gaji / Uang Saku", amount: 1500000, max: 5000000 },
      { id: 2, name: "Bonus / Sampingan", amount: 250000, max: 3000000 }
    ],
    expenses: [
      { id: 101, name: "Makan & Jajan Harian", amount: 600000, max: 2500000 },
      { id: 102, name: "Rokok / Hiburan", amount: 250000, max: 1500000 },
      { id: 103, name: "Bensin / Transportasi", amount: 150000, max: 1500000 },
      { id: 104, name: "Kuota & Tagihan", amount: 150000, max: 1500000 }
    ],
    target: 500000
  };

  let state = JSON.parse(localStorage.getItem('simulasiAnggaranData')) || JSON.parse(JSON.stringify(defaultData));

  // Muat foto tersimpan jika pengguna menggantinya lewat galeri HP
  const savedAvatar = localStorage.getItem('simulasiAvatar');
  if (savedAvatar) {
    document.getElementById('avatarImg').src = savedAvatar;
  }

  function gantiFoto(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      const imgData = e.target.result;
      document.getElementById('avatarImg').src = imgData;
      try {
        localStorage.setItem('simulasiAvatar', imgData);
      } catch (err) {
        alert('Ukuran foto terlalu besar untuk disimpan permanen, gunakan foto yang lebih ringan.');
      }
    };
    reader.readAsDataURL(file);
  }

  function simpanState() {
    localStorage.setItem('simulasiAnggaranData', JSON.stringify(state));
  }

  function formatRupiah(angka) {
    const isNeg = angka < 0;
    const str = Math.abs(angka).toLocaleString('id-ID');
    return (isNeg ? '-Rp' : 'Rp') + str;
  }

  function renderList(type) {
    const container = document.getElementById(type === 'income' ? 'incomeList' : 'expenseList');
    const items = type === 'income' ? state.incomes : state.expenses;
    container.innerHTML = '';

    items.forEach((item, index) => {
      const row = document.createElement('div');
      row.className = 'item-row';
      const maxSlider = Math.max(item.max || 2000000, item.amount * 1.5, 100000);

      row.innerHTML = `
        <div class="item-top">
          <input type="text" class="input-name" value="${item.name}" 
            onchange="ubahNama('${type}', ${index}, this.value)" placeholder="Nama pos...">
          <input type="number" class="input-nominal ${type === 'expense' ? 'expense-text' : ''}" 
            value="${item.amount}" step="5000" min="0"
            oninput="ubahNominal('${type}', ${index}, this.value, 'input')">
          <button class="btn-del" onclick="hapusItem('${type}', ${index})" title="Hapus">×</button>
        </div>
        <div class="slider-wrap">
          <input type="range" class="${type === 'expense' ? 'expense-slider' : ''}" 
            min="0" max="${maxSlider}" step="5000" value="${item.amount}"
            oninput="ubahNominal('${type}', ${index}, this.value, 'slider')">
        </div>
      `;
      container.appendChild(row);
    });
  }

  function ubahNama(type, index, val) {
    const list = type === 'income' ? state.incomes : state.expenses;
    list[index].name = val || 'Tanpa Nama';
    simpanState();
  }

  function ubahNominal(type, index, val, source) {
    const list = type === 'income' ? state.incomes : state.expenses;
    const num = Math.max(0, parseInt(val) || 0);
    list[index].amount = num;

    const container = document.getElementById(type === 'income' ? 'incomeList' : 'expenseList');
    const row = container.children[index];
    if (source === 'input') {
      const slider = row.querySelector('input[type="range"]');
      if (num > parseInt(slider.max)) slider.max = num * 1.5;
      slider.value = num;
    } else {
      const numInput = row.querySelector('input[type="number"]');
      numInput.value = num;
    }

    simpanState();
    hitungSemua();
  }

  function tambahItem(type) {
    const list = type === 'income' ? state.incomes : state.expenses;
    list.push({
      id: Date.now(),
      name: type === 'income' ? 'Pendapatan Baru' : 'Pengeluaran Baru',
      amount: 50000,
      max: 2000000
    });
    simpanState();
    renderList(type);
    hitungSemua();
  }

  function hapusItem(type, index) {
    const list = type === 'income' ? state.incomes : state.expenses;
    list.splice(index, 1);
    simpanState();
    renderList(type);
    hitungSemua();
  }

  function resetDefault() {
    if (confirm('Kembalikan semua pos pendapatan dan pengeluaran ke pengaturan awal?')) {
      state = JSON.parse(JSON.stringify(defaultData));
      document.getElementById('targetInput').value = state.target;
      simpanState();
      renderAll();
    }
  }

  function hitungSemua() {
    const totalMasuk = state.incomes.reduce((sum, item) => sum + item.amount, 0);
    const totalKeluar = state.expenses.reduce((sum, item) => sum + item.amount, 0);
    const sisa = totalMasuk - totalKeluar;

    const targetVal = parseInt(document.getElementById('targetInput').value) || 0;
    state.target = targetVal;
    simpanState();

    document.getElementById('totalMasuk').textContent = formatRupiah(totalMasuk);
    document.getElementById('totalKeluar').textContent = formatRupiah(totalKeluar);
    document.getElementById('sisaUang').textContent = formatRupiah(sisa);

    const summaryBox = document.getElementById('summaryBox');
    const statusLabel = document.getElementById('statusLabel');
    const rasioEl = document.getElementById('rasioTabungan');

    if (sisa < 0) {
      summaryBox.classList.add('minus');
      statusLabel.textContent = 'Defisit (Pengeluaran Melebihi Pendapatan)';
      rasioEl.textContent = '0%';
    } else {
      summaryBox.classList.remove('minus');
      statusLabel.textContent = 'Potensi Tabungan (Sisa Bersih)';
      const persen = totalMasuk > 0 ? Math.round((sisa / totalMasuk) * 100) : 0;
      rasioEl.textContent = persen + '%';
    }

    const progressFill = document.getElementById('progressFill');
    const targetStatus = document.getElementById('targetStatus');

    if (targetVal <= 0) {
      progressFill.style.width = '100%';
      targetStatus.textContent = 'Target tabungan belum ditentukan.';
    } else if (sisa <= 0) {
      progressFill.style.width = '0%';
      targetStatus.textContent = `Kurang ${formatRupiah(targetVal)} lagi untuk mencapai target.`;
    } else {
      const pct = Math.min(100, Math.round((sisa / targetVal) * 100));
      progressFill.style.width = pct + '%';
      if (sisa >= targetVal) {
        const lebih = sisa - targetVal;
        targetStatus.innerHTML = `<strong>Target tercapai!</strong> Ada kelebihan dana ${formatRupiah(lebih)}.`;
      } else {
        const kurang = targetVal - sisa;
        targetStatus.textContent = `Tercapai ${pct}% — Kurang ${formatRupiah(kurang)} lagi dari target.`;
      }
    }
  }

  function renderAll() {
    document.getElementById('targetInput').value = state.target;
    renderList('income');
    renderList('expense');
    hitungSemua();
  }

  renderAll();
</script>

</body>
</html>
